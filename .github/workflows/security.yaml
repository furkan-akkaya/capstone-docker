name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-scan weekly so newly-disclosed CVEs in unchanged images surface.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

env:
  TRIVY_VERSION: v0.74.0

jobs:
  # ── Dockerfile best-practice / security linting ────────────────────────────
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
          config: .hadolint.yaml

  # ── Secret scanning across the full git history ────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Image vulnerability scanning (CVEs) ────────────────────────────────────
  image-cve-scan:
    name: Image CVE scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"

      - name: Build API image
        run: docker build -t capstone-api:scan ./api

      - name: Scan image → table (build log)
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed capstone-api:scan

      - name: Scan image → SARIF
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --format sarif -o trivy-image.sarif capstone-api:scan

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # needs a public repo or GitHub Advanced Security
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ── IaC / manifest misconfiguration scanning ───────────────────────────────
  config-scan:
    name: Manifest misconfig scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"

      - name: Scan manifests → table (build log)
        run: trivy config --severity CRITICAL,HIGH,MEDIUM .

      - name: Scan manifests → SARIF
        run: trivy config --severity CRITICAL,HIGH,MEDIUM --format sarif -o trivy-config.sarif .

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

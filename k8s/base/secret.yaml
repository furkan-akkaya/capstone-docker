# ─────────────────────────────────────────────────────────────────────────────
# DEMO SECRET — placeholder values only.
#
# In a real cluster this Secret would NOT live in git as plaintext. Use one of:
#   • Sealed Secrets (bitnami-labs/sealed-secrets) — encrypts into a SealedSecret CRD
#   • External Secrets Operator — syncs from Vault / AWS Secrets Manager / GCP SM
#   • SOPS + age — encrypts the values in-place, decrypted by the GitOps controller
#
# The kustomize overlays reference this Secret by name (`capstone-db`), so swapping
# in a managed backend is a one-line change with no workload edits.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: capstone-db
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_USER: capstone
  POSTGRES_PASSWORD: change_me_in_a_real_cluster
  POSTGRES_DB: capstone_db
